name: studio_crow
description: "Just Dance - offline studio manager for students, fees, attendance and collections."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  intl: ^0.20.2
  google_sign_in: ^6.3.0
  http: ^1.3.0
  workmanager: ^0.9.0+3
  local_auth: ^2.3.0
  pdf: ^3.11.3
  flutter_svg: ^2.2.1
  image: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon_bg.png
    - assets/icon_whatsapp.svg
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-400.ttf
          weight: 400
        - asset: fonts/Inter-500.ttf
          weight: 500
        - asset: fonts/Inter-600.ttf
          weight: 600
        - asset: fonts/Inter-700.ttf
          weight: 700
        - asset: fonts/Inter-800.ttf
          weight: 800
