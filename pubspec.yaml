name: studio_crow
description: StudioCrow — Studio Management App for Gyms, Dance, Karate, Yoga
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # ===== ALLOWED PACKAGES ONLY =====
  sqflite: ^2.3.0              # Local SQLite DB
  path_provider: ^2.1.1        # Device paths (DB + photos)
  path: ^1.8.3
  image_picker: ^1.0.4         # Camera/Gallery photos
  url_launcher: ^6.2.1         # Call / WhatsApp deep links
  share_plus: ^7.2.1           # Share ID card / invoice images
  intl: ^0.18.1                # Date formatting
  google_sign_in: ^6.1.5       # Google Drive backup auth
  http: ^1.1.0                 # Drive API calls
  workmanager: ^0.9.0          # Daily 4AM silent backup
  local_auth: ^2.1.8           # Biometric / device PIN

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png

  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf