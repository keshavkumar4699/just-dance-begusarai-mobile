name: studio_crow
description: Studio Crow - studio management app for a single studio owner (students, fees, PT, attendance, collections). Offline-first.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  intl: ^0.20.2
  google_sign_in: ^6.2.2
  http: ^1.3.0
  workmanager: ^0.10.1
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
  assets:
    - assets/images/logo.png
    - assets/images/logo_512.png
    - assets/images/placeholder.png
